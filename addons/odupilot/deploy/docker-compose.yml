name: odupilot

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        OPENCODE_IMAGE: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:1.18.9@sha256:f958f81ae08f5f9bf16e2bb3cd6e472b2ce6aa024a741c3e2dec1ed89ea69232}
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      ODUPILOT_UID: ${ODUPILOT_UID:-1000}
      ODUPILOT_GID: ${ODUPILOT_GID:-1000}
      HOME: /var/lib/opencode
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD}
    expose:
      - "4096"
    volumes:
      - workspace:/workspace
      - opencode_home:/var/lib/opencode
    networks:
      - odupilot
    mem_limit: ${OPENCODE_MEM_LIMIT:-4g}
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --user "$${OPENCODE_SERVER_USERNAME}:$${OPENCODE_SERVER_PASSWORD}"
          http://127.0.0.1:4096/global/health >/dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ODOO_URL: ${ODOO_URL:?Set ODOO_URL}
      ODOO_DATABASE: ${ODOO_DATABASE:?Set ODOO_DATABASE}
      ODOO_LOGIN: ${ODOO_LOGIN:?Set ODOO_LOGIN}
      ODOO_PASSWORD: ${ODOO_PASSWORD:?Set ODOO_PASSWORD}
      OPENCODE_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD}
      ODUPILOT_EVENT_BATCH_SIZE: ${ODUPILOT_EVENT_BATCH_SIZE:-50}
      ODUPILOT_EVENT_FLUSH_SECONDS: ${ODUPILOT_EVENT_FLUSH_SECONDS:-0.5}
    user: "${ODUPILOT_UID:-1000}:${ODUPILOT_GID:-1000}"
    volumes:
      - workspace:/workspace
    depends_on:
      opencode:
        condition: service_healthy
    networks:
      - odupilot
    restart: always

networks:
  odupilot:

volumes:
  workspace:
    external: true
    name: ${ODUPILOT_WORKSPACE_VOLUME:?Set ODUPILOT_WORKSPACE_VOLUME}
  opencode_home:
    name: ${ODUPILOT_OPENCODE_HOME_VOLUME:-odupilot-opencode-home}
